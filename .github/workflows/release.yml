name: Release verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tree-sitter/tree-sitter
          ref: cd5b087cd9f45ca6d93ab1954f6b7c8534f324d2
          path: .ci/tree-sitter-runtime
      - uses: actions/checkout@v4
        with:
          repository: tcsh-org/tcsh
          ref: f773aba56aa128a38712987b1b8bdbc393d1e4d0
          path: .ci/tcsh-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build pinned Tree-sitter runtime
        shell: bash
        run: |
          cmake -S .ci/tree-sitter-runtime -B "$RUNNER_TEMP/tree-sitter-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/tree-sitter-runtime"
          cmake --build "$RUNNER_TEMP/tree-sitter-build" --config Release
          cmake --build "$RUNNER_TEMP/tree-sitter-build" --config Release --target install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/tree-sitter-runtime/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/tree-sitter-runtime/lib" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check:release
      - name: Verify pinned upstream commit
        shell: bash
        run: test "$(git -C .ci/tcsh-upstream rev-parse HEAD)" = "f773aba56aa128a38712987b1b8bdbc393d1e4d0"
      - run: npm run check:upstream -- --upstream-root "${{ github.workspace }}/.ci/tcsh-upstream"
      - name: Pack verified artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist --cache "$RUNNER_TEMP/npm-cache"
          npm publish --dry-run --cache "$RUNNER_TEMP/npm-cache" dist/tree-sitter-tcsh-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-tcsh-${{ github.ref_name }}
          path: dist/*.tgz
          if-no-files-found: error
